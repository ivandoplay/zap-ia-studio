<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e151f">
<title>Ienvia — Confirmando link seguro</title>
<link rel="icon" href="/icon-v2.svg" type="image/svg+xml">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#0e151f;color:#eef2f6;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
  main{width:100%;max-width:420px;background:#141d29;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:32px 28px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .icone{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;background:rgba(47,158,110,.15);color:#2f9e6e}
  .icone.erro{background:rgba(224,49,49,.12);color:#ff8a8a}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#8fa3b8;font-size:13px;line-height:1.6;margin:0 0 20px}
  .btn{display:inline-block;padding:12px 22px;border-radius:9px;background:#2f9e6e;color:#fff;font-weight:700;font-size:14px;text-decoration:none}
  .btn.secundario{background:transparent;border:1px solid rgba(255,255,255,.15);color:#c3cedb}
  .acoes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<main>
  <div class="icone" id="icone" aria-hidden="true">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
  </div>
  <h1 id="titulo">Confirmando seu link…</h1>
  <p id="mensagem">Só um instante.</p>
  <div class="acoes" id="acoes" style="display:none">
    <a class="btn" id="btnContinuar" href="/visao-geral/">Continuar para o painel</a>
  </div>
</main>
<script>
(function () {
  var icone = document.getElementById('icone');
  var titulo = document.getElementById('titulo');
  var mensagem = document.getElementById('mensagem');
  var acoes = document.getElementById('acoes');

  function falha(texto) {
    icone.classList.add('erro');
    icone.innerHTML = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5"></path><path d="M12 16.5h.01"></path><circle cx="12" cy="12" r="9"></circle></svg>';
    titulo.textContent = 'Não foi possível confirmar';
    mensagem.textContent = texto;
    acoes.style.display = 'flex';
    document.getElementById('btnContinuar').textContent = 'Ir para a Visão geral';
  }

  var params = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  var query = new URLSearchParams(window.location.search);
  var erro = query.get('error_description') || query.get('error') || params.get('error_description') || params.get('error');
  if (erro) { falha('O link informado foi recusado: ' + erro); return; }

  var accessToken = params.get('access_token');
  var refreshToken = params.get('refresh_token');
  var tipo = params.get('type') || 'invite';
  if (!accessToken) {
    falha('Link inválido ou expirado. Peça um novo link de convite ou recuperação.');
    return;
  }
  try {
    localStorage.setItem('zapia_cloud_auth', JSON.stringify({
      access_token: accessToken,
      refresh_token: refreshToken || null,
      token_type: params.get('token_type') || 'bearer',
      expires_in: Number(params.get('expires_in') || 0) || null,
      type: tipo
    }));
  } catch (e) { /* armazenamento indisponível: ainda permitimos continuar sem sessão salva */ }
  titulo.textContent = tipo === 'recovery' ? 'Link de recuperação confirmado' : 'Convite confirmado';
  mensagem.textContent = 'Sua sessão foi preparada. Se for o primeiro acesso, defina sua senha em “Definir senha” no painel.';
  acoes.style.display = 'flex';
})();
</script>
</body>
</html>
