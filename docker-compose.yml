# Ienvia Motor — Docker Compose para Oracle Cloud Always Free
# Uso: docker compose up -d
# O motor roda em modo local (IS_VERCEL=false) com Supabase para sincronização de dados

services:
  motor:
    build: .
    container_name: ienvia-motor
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Modo local (não Vercel) — roda servidor Node completo com WebSocket + Baileys
      - VERCEL=""
      # Porta do motor
      - PORT=3000
      # Supabase (dados dos clientes, CRM, auth — continua centralizado)
      - SUPABASE_URL=${SUPABASE_URL:-https://iuysmojhaxplnhfrxqkv.supabase.co}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      # IA (Gemini para áudio/transcrição + OpenRouter para texto)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Origin confiável (personalizar com domínio do cliente)
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-}
    volumes:
      # Dados persistentes: banco, uploads, autenticação WhatsApp, packs de treinamento
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ======================== WEBHOOK Evolution API ========================
  # Recebe mensagens do Evolution API, processa com IA do Ienvia Motor e responde
  webhook:
    build:
      context: .
      dockerfile: Dockerfile.webhook
    container_name: ienvia-evolution-webhook
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      # URL do Evolution API (pool/API)
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-https://pool-evolution-api-067.cloud2.pageup.dev.br}
      # Chave global da API (para listar instâncias)
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      # IA do Ienvia Motor (cada cliente coloca suas chaves)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Porta do webhook
      - PORT=3001
    volumes:
      # Dados compartilhados com o motor (perfil do cliente, histórico, chaves de IA)
      - ./data:/app/data
    depends_on:
      - motor
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
